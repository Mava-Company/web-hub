<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Product Details
  </title>

  <link
    rel="stylesheet"
    href="css/order.css"
  >

</head>

<body>


  <!-- ========================= -->
  <!-- NAVBAR -->
  <!-- ========================= -->

  <header class="navbar">

    <div class="logo">
      💎 Elegance Jewelry
    </div>

    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="order.html">
        Shop Now
      </a>

      <a href="track.html">
        Track Order
      </a>

      <a
        href="about.html"
        target="_blank"
      >
        About Us
      </a>

    </nav>

  </header>



  <!-- ========================= -->
  <!-- PRODUCT DETAILS -->
  <!-- ========================= -->

  <section class="order-section">

    <div id="cakeDetails"></div>


    <hr style="margin:40px 0;">


    <h2>
      Order Information 💎
    </h2>


    <form id="orderForm">


      <!-- ========================= -->
      <!-- CUSTOMER NAME -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Full Name
        </label>

        <input
          type="text"
          id="customerName"
          required
        >

      </div>



      <!-- ========================= -->
      <!-- PHONE -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Phone Number
        </label>

        <input
          type="text"
          id="phone"
          required
        >

      </div>



      <!-- ========================= -->
      <!-- ADDRESS -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Delivery Address
        </label>

        <input
          type="text"
          id="address"
        >

      </div>



      <!-- ========================= -->
      <!-- SIZE -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Size
        </label>

        <select id="size">

          <option>
            Small
          </option>

          <option>
            Medium
          </option>

          <option>
            Large
          </option>

          <option>
            One Size
          </option>

        </select>

      </div>



      <!-- ========================= -->
      <!-- PRODUCT COLOR -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Preferred Color
        </label>

        <input
          type="text"
          id="cakeMessage"
          placeholder="Example: Gold, Silver, Rose Gold..."
        >

      </div>



      <!-- ========================= -->
      <!-- DELIVERY DATE -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Delivery Date
        </label>

        <input
          type="date"
          id="deliveryDate"
        >

      </div>



      <!-- ========================= -->
      <!-- NOTES -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Additional Notes
        </label>

        <textarea
          id="notes"
          placeholder="Any special requests or notes..."
        ></textarea>

      </div>



      <!-- ========================= -->
      <!-- SUBMIT -->
      <!-- ========================= -->

      <button
        type="submit"
        class="submit-btn"
      >
        Place Order
      </button>

    </form>

  </section>



  <!-- ========================= -->
  <!-- ORDER SUCCESS POPUP -->
  <!-- ========================= -->

  <div id="popup" class="popup">

    <div class="popup-content">

      <h3>
        Order Submitted Successfully ✅
      </h3>

      <p id="orderText"></p>


      <button id="copyBtn">
        📋 Copy Order Number
      </button>


      <button onclick="closePopup()">
        Close
      </button>

    </div>

  </div>






  <!-- ========================= -->
  <!-- FIREBASE -->
  <!-- ========================= -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script src="js/firebase.js"></script>


  <!-- ========================= -->
  <!-- PRODUCT DETAILS JS -->
  <!-- ========================= -->

  <script src="js/cake-details.js"></script>


</body>

</html>
