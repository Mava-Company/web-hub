<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Place Your Order
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


  <!-- ========================= -->
  <!-- NAVBAR -->
  <!-- ========================= -->

  <header class="navbar">

    <div class="logo">
      💎 Place Your Order
    </div>

    <nav>

      <a href="index.html">
        Home
      </a>

    </nav>

  </header>



  <!-- ========================= -->
  <!-- ORDER SECTION -->
  <!-- ========================= -->

  <section class="admin-section">


    <!-- ========================= -->
    <!-- PRODUCT DETAILS -->
    <!-- ========================= -->

    <div
      class="admin-box"
      id="cakeDetails"
    >

      <h2>
        Loading Product...
      </h2>

    </div>



    <!-- ========================= -->
    <!-- ORDER FORM -->
    <!-- ========================= -->

    <div class="admin-box">

      <h2>
        Complete Your Order 🧾
      </h2>


      <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
      >


      <input
        type="text"
        id="phone"
        placeholder="Phone Number"
        required
      >


      <textarea
        id="notes"
        placeholder="Additional Notes"
      ></textarea>


      <button onclick="sendOrder()">
        Place Order
      </button>


      <p id="orderCodeBox"></p>


      <button
        id="copyBtn"
        style="display:none;"
      >
        Copy Order Code
      </button>

    </div>

  </section>



  <!-- ========================= -->
  <!-- FIREBASE -->
  <!-- ========================= -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase.js"></script>



  <script>


    // =========================
    // GET PRODUCT ID FROM URL
    // =========================

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const cakeId =
      urlParams.get("id");


    const cakeDetails =
      document.getElementById(
        "cakeDetails"
      );


    let cakeData = null;



    // =========================
    // LOAD PRODUCT DATA
    // =========================

    db.collection("cakes")
      .doc(cakeId)
      .get()
      .then(doc => {


        cakeData =
          doc.data();


        cakeDetails.innerHTML = `

          <img
            src="${cakeData.image}"
            style="width:100%;border-radius:10px;"
          >

          <h2>
            ${cakeData.name}
          </h2>

          <p>
            ${cakeData.description}
          </p>

          <h3>
            💰 ${cakeData.price} $
          </h3>

        `;

      });



    // =========================
    // SEND ORDER
    // =========================

    async function sendOrder() {


      const name =
        document.getElementById(
          "name"
        ).value;


      const phone =
        document.getElementById(
          "phone"
        ).value;


      const notes =
        document.getElementById(
          "notes"
        ).value;



      if (!name || !phone) {

        alert(
          "Please enter the required information."
        );

        return;

      }



      // Generate order ID

      const orderId =
        "ORD-" +
        Math.floor(
          Math.random() * 1000000
        );



      // Order data

      const orderData = {

        orderId,

        cakeType:
          cakeData.name,

        cakeId:
          cakeId,

        customerName:
          name,

        phone:
          phone,

        notes:
          notes,

        status:
          "Pending",

        createdAt:
          Date.now()

      };



      // Save order to Firebase

      await db
        .collection("orders")
        .add(orderData);



      // Show order code

      document
        .getElementById(
          "orderCodeBox"
        )
        .innerText =
        "Order Code: " +
        orderId;



      // Copy button

      const copyBtn =
        document.getElementById(
          "copyBtn"
        );


      copyBtn.style.display =
        "block";


      copyBtn.onclick = () => {


        navigator.clipboard
          .writeText(orderId);


        alert(
          "Order code copied successfully!"
        );

      };



      // Success message

      alert(
        "Your order has been submitted successfully!"
      );

    }

  </script>


</body>

</html>
