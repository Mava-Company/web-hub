<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Place an Order
  </title>

  <link rel="stylesheet" href="css/order.css">

</head>

<body>


  <!-- ========================= -->
  <!-- NAVBAR -->
  <!-- ========================= -->

  <header class="navbar">

    <div class="logo">
      💎 Elegance Jewelry
    </div>

    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="order.html">
        Shop Now
      </a>

      <a href="track.html">
        Track Order
      </a>

      <a href="about.html" target="_blank">
        About Us
      </a>

    </nav>

  </header>

<div id="container-3e4f51e3da2c40b553f5f3d3a084a3d5"></div>


  <!-- ========================= -->
  <!-- ORDER FORM -->
  <!-- ========================= -->

  <section class="order-section">

    <h1>
      Place Your Order 💎
    </h1>


    <form id="orderForm">


      <!-- ========================= -->
      <!-- CUSTOMER INFO -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Full Name
        </label>

        <input
          type="text"
          id="customerName"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Phone Number
        </label>

        <input
          type="text"
          id="phone"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Delivery Address
        </label>

        <input
          type="text"
          id="address"
        >

      </div>



      <!-- ========================= -->
      <!-- PRODUCT TYPE -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Product Type
        </label>

        <select id="cakeType">

          <option>
            Necklace
          </option>

          <option>
            Earrings
          </option>

          <option>
            Bracelet
          </option>

          <option>
            Ring
          </option>

          <option>
            Women's Accessories
          </option>

          <option>
            Bag
          </option>

          <option>
            Watch
          </option>

          <option>
            Gift
          </option>

        </select>

      </div>



      <!-- ========================= -->
      <!-- SIZE -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Size
        </label>

        <select id="size">

          <option>
            Small
          </option>

          <option>
            Medium
          </option>

          <option>
            Large
          </option>

          <option>
            One Size
          </option>

        </select>

      </div>



      <!-- ========================= -->
      <!-- STYLE -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Style
        </label>

        <select id="flavor">

          <option>
            Elegant
          </option>

          <option>
            Classic
          </option>

          <option>
            Modern
          </option>

          <option>
            Luxury
          </option>

          <option>
            Minimalist
          </option>

        </select>

      </div>



      <!-- ========================= -->
      <!-- DELIVERY DATE -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Delivery Date
        </label>

        <input
          type="date"
          id="deliveryDate"
        >

      </div>



      <!-- ========================= -->
      <!-- NOTES -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Additional Notes
        </label>

        <textarea
          id="notes"
          placeholder="Add any special requests or notes..."
        ></textarea>

      </div>



      <!-- ========================= -->
      <!-- SUBMIT -->
      <!-- ========================= -->

      <button
        type="submit"
        class="submit-btn"
      >
        Place Order
      </button>

    </form>

  </section>



  <!-- ========================= -->
  <!-- ADMIN MODAL SCRIPT -->
  <!-- ========================= -->

  <script>

    const adminModal =
      document.getElementById("adminLogin");


    // Open admin modal

    function showAdminLogin(){

      if (adminModal) {

        adminModal.style.display = "flex";

      }

    }


    // Close admin modal

    function closeAdminModal(){

      if (adminModal) {

        adminModal.style.display = "none";

      }

    }


    // Close when clicking outside the modal

    window.addEventListener("click", (e) => {

      if(e.target === adminModal){

        closeAdminModal();

      }

    });

  </script>



  <!-- ========================= -->
  <!-- ORDER JS -->
  <!-- ========================= -->

  <script src="js/order.js"></script>

<script async="async" data-cfasync="false" src="https://pl31076846.profitableratecpmnetwork.com/3e4f51e3da2c40b553f5f3d3a084a3d5/invoke.js"></script>


  <!-- ========================= -->
  <!-- FIREBASE -->
  <!-- ========================= -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase.js"></script>


</body>

</html>
