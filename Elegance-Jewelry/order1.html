<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Product Order
  </title>


  <style>

    body {

      font-family: Arial, sans-serif;

      padding: 20px;

      direction: ltr;

    }


    #cakeInfo img {

      width: 200px;

      border-radius: 10px;

    }


    form {

      margin-top: 20px;

      display: flex;

      flex-direction: column;

      gap: 10px;

      max-width: 300px;

    }


    input,
    textarea {

      padding: 10px;

      border: 1px solid #ccc;

      border-radius: 6px;

    }


    button {

      padding: 10px;

      cursor: pointer;

      background: #d4af37;

      color: white;

      border: none;

      border-radius: 6px;

    }


    #orderCodeBox {

      margin-top: 20px;

      padding: 10px;

      background: #eee;

      display: inline-block;

    }

  </style>

</head>


<body>


  <!-- ========================= -->
  <!-- PRODUCT DETAILS -->
  <!-- ========================= -->
<div id="container-3e4f51e3da2c40b553f5f3d3a084a3d5"></div>

  <h2>
    Product Details 💎
  </h2>

  <div id="cakeInfo"></div>


  <hr>


  <!-- ========================= -->
  <!-- ORDER DETAILS -->
  <!-- ========================= -->

  <h3>
    Order Information
  </h3>


  <form id="orderForm">


    <input
      id="name"
      placeholder="Full Name"
      required
    >


    <input
      id="phone"
      placeholder="Phone Number"
      required
    >


    <input
      id="address"
      placeholder="Delivery Address"
      required
    >


    <textarea
      id="notes"
      placeholder="Additional Notes"
    ></textarea>


    <button type="submit">
      Place Order
    </button>

  </form>


  <!-- ========================= -->
  <!-- ORDER CODE -->
  <!-- ========================= -->

  <h3>
    Order Code:
  </h3>


  <div id="orderCodeBox">
    No order code has been generated yet
  </div>


  <br>


  <button id="copyCode">
    Copy Order Code
  </button>



<script async="async" data-cfasync="false" src="https://pl31076846.profitableratecpmnetwork.com/3e4f51e3da2c40b553f5f3d3a084a3d5/invoke.js"></script>

  <!-- ========================= -->
  <!-- FIREBASE -->
  <!-- ========================= -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script src="js/firebase.js"></script>


  <!-- ========================= -->
  <!-- ORDER JS -->
  <!-- ========================= -->

  <script src="js/order1.js"></script>


</body>

</html>
