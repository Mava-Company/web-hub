<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Track Your Order
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


  <!-- ========================= -->
  <!-- NAVBAR -->
  <!-- ========================= -->

  <header class="navbar">

    <div class="logo">
      💎 Elegance Jewelry
    </div>


    <nav class="nav-links">


      <a href="index.html">
        Home
      </a>


      <a href="order.html">
        Shop Now
      </a>


      <a href="track.html">
        Track Order
      </a>


      <a
        href="about.html"
        target="_blank"
      >
        About Us
      </a>


    </nav>

  </header>



  <!-- ========================= -->
  <!-- TRACK ORDER -->
  <!-- ========================= -->

  <section class="track-section">


    <h1>
      Track Your Order 💎
    </h1>


    <div class="track-box">


      <input
        type="text"
        id="trackInput"
        placeholder="Enter your order number"
      >


      <button id="trackBtn">
        Track Order
      </button>


    </div>



    <!-- ========================= -->
    <!-- TRACK RESULT -->
    <!-- ========================= -->

    <div
      id="trackResult"
      class="track-result"
    >

      <!-- Order information will appear here -->

    </div>


  </section>



  <!-- ========================= -->
  <!-- ADMIN MODAL -->
  <!-- ========================= -->

  <div id="adminLogin" class="modal">


    <div class="modal-content">


      <span
        class="close-btn"
        onclick="closeAdminModal()"
      >
        &times;
      </span>


      <h2>
        🔐 Admin Login
      </h2>


      <input
        type="password"
        id="adminPassword"
        placeholder="Enter Password"
      >


      <button id="loginBtn">
        Login
      </button>


      <p id="loginError"></p>


    </div>


  </div>



  <!-- ========================= -->
  <!-- TRACK JS -->
  <!-- ========================= -->

  <script src="js/track.js"></script>



  <!-- ========================= -->
  <!-- FIREBASE -->
  <!-- ========================= -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script src="js/firebase.js"></script>


</body>

</html>
