<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<meta
name="theme-color"
content="#e63920"

>

  <title>
    تتبع الطلب | بيتزا صبح ومسا
  </title>

  <link
    rel="stylesheet"
    href="css/track.css"
  >

</head>

<body>

  <!-- ========================= -->

  <!-- NAVBAR -->

  <!-- ========================= -->

  <header class="navbar">

<div class="logo">
  🍕 بيتزا صبح ومسا
</div>

<nav class="nav-links">

  <a href="index.html">
    الرئيسية
  </a>

  <a href="order.html">
    اطلب الآن
  </a>

  <a href="track.html" class="active">
    تتبع الطلب
  </a>

  <a
    href="about.html"
    target="_blank"
  >
    من نحن
  </a>

 
</nav>

  </header>

  <!-- ========================= -->

  <!-- TRACK HERO -->

  <!-- ========================= -->

  <section class="track-hero">

<div class="hero-content">

  <div class="pizza-icon">
    🍕
  </div>

  <span class="hero-badge">
    خدمة تتبع الطلبات
  </span>

  <h1>
    أين وصل طلبك؟ 🔥
  </h1>

  <p>
    أدخل رقم طلبك لمعرفة حالة طلب البيتزا
    ومتابعة التجهيز والتوصيل.
  </p>

</div>

  </section>

  <!-- ========================= -->

  <!-- TRACK SECTION -->

  <!-- ========================= -->

  <main class="track-section">

<div class="track-container">


  <!-- TITLE -->

  <div class="track-title">

    <div class="track-title-icon">
      🔎
    </div>

    <div>

      <h2>
        تتبع طلبك
      </h2>

      <p>
        أدخل رقم الطلب الذي حصلت عليه بعد إتمام الطلب
      </p>

    </div>

  </div>



  <!-- SEARCH BOX -->

  <div class="track-box">

    <label for="trackInput">
      رقم الطلب
    </label>

    <div class="search-row">

      <input
        type="text"
        id="trackInput"
        placeholder="مثال: PZ12345678"
        autocomplete="off"
      >

      <button id="trackBtn">
        🔍 تتبع الطلب
      </button>

    </div>

  </div>



  <!-- RESULT -->

  <div
    id="trackResult"
    class="track-result"
  ></div>


</div>

  </main>

 
  <!-- ========================= -->

  <!-- FIREBASE -->

  <!-- ========================= -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase.js"></script>

  <!-- ========================= -->

  <!-- TRACK JS -->

  <!-- ========================= -->

  <script src="js/track.js"></script>

</body>

</html>
